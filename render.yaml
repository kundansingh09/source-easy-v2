# Render Blueprint: one Python web service (the API) + one static site (the UI).
#
# Why Render and not Vercel for the backend: this API is a long-lived
# stateful process that keeps a Qdrant client and a loaded embedding model
# in memory for the life of the process. Vercel's Python functions are
# serverless: no persistent memory between invocations, a hard bundle-size
# limit that onnxruntime + model weights blow through, and a request
# timeout that doesn't suit a multi-second cold path. Vercel is perfectly
# good for the FRONTEND (it's a static bundle), so splitting them across
# providers is also a legitimate option - this blueprint just keeps both
# on Render for one dashboard.
#
# Updated for the Qdrant Cloud split: corpus embedding now happens ONCE,
# locally, and is pushed to a persistent Qdrant Cloud cluster - Render no
# longer re-embeds ~1,300+ companies on every cold boot. That was the
# biggest RAM/time cost in the original single-service design (see the
# retired disk block below for the note that first flagged it), so `plan:
# free` is worth TRYING now. It is not guaranteed to fit: Qdrant Cloud's
# server-side inference (which would let Render skip loading the embedding
# model entirely) is a paid-Qdrant-plan feature - on a free Qdrant cluster,
# this API still loads onnxruntime + the MiniLM ONNX weights into memory to
# embed each incoming QUERY locally, it just no longer holds the whole
# corpus's vectors or re-embeds the whole corpus. If Render's logs show the
# instance getting OOM-killed (deploy dies with no clear error, or the
# process restarts right after a search request), that's this - bump to
# `starter` ($7/mo, 512MB -> still tight) or `standard` ($25/mo, 2GB).
#
# No disk block: free-tier services can't have one. Without it, the ~90MB
# ONNX weights re-download on every cold boot instead of being cached - a
# real but modest cost, and free tier spins down after 15 min idle anyway,
# so this happens often. The block used to live here as the FastEmbed
# model cache, with a note that it did NOT cache the embeddings themselves
# and that persisting a Qdrant snapshot instead of rebuilding from JSON was
# "the thing to fix next" - that fix is exactly what the Qdrant Cloud split
# above is. If you move to a paid plan and want the weights cached again,
# the block is still valid, just re-add it:
#
#   disk:
#     name: fastembed-cache
#     mountPath: /var/cache/fastembed
#     sizeGB: 1

services:
  # ------------------------------------------------------------- API ---
  - type: web
    name: semicon-sourcing-api
    runtime: python
    plan: free
    region: frankfurt          # closest to the Asian shows' users; change freely
    branch: main
    buildCommand: pip install -r requirements.txt
    # 1 worker on purpose. Each uvicorn worker loads its OWN copy of the
    # embedding model into memory, so 2 workers = 2x the RAM for no gain at
    # this traffic level - scale with instances, not workers.
    startCommand: uvicorn backend.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FASTEMBED_CACHE_PATH
        value: /tmp/fastembed_cache
      - key: DATA_PATH
        value: full-global-refined-hybrid.json
      - key: TAXONOMY_PATH
        value: data/categories.json
      - key: QDRANT_URL
        # Your Qdrant Cloud cluster URL. Seed the cluster locally BEFORE
        # this service's first boot (python backend/api.py with these two
        # vars set) - otherwise the first Render boot finds an empty
        # collection and attempts the full embed itself, on free-tier RAM.
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        # Must match the static site's real URL once Render assigns it, or
        # the browser blocks every request with a CORS error that looks
        # like the API is down.
        sync: false
      - key: OPENAI_API_KEY
        # Optional. Absent = the rerank toggle renders disabled instead of
        # erroring at request time.
        sync: false

  # -------------------------------------------------------- frontend ---
  - type: web
    name: semicon-sourcing-web
    runtime: static
    branch: main
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        # Vite inlines this at BUILD time, not runtime - changing it
        # requires "Clear build cache & deploy" on the static site, not
        # just a restart.
        sync: false
    routes:
      # SPA fallback. Without it, a refresh on any non-root path 404s.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin